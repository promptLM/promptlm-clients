[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptlm"
version = "0.1.0"
description = "Python SDK for promptLM JSON prompt bundles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "promptLM" }]
keywords = ["promptlm", "prompts", "llm", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/promptLM/promptlm-clients"
Repository = "https://github.com/promptLM/promptlm-clients"
Issues = "https://github.com/promptLM/promptlm-clients/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/promptlm"]
artifacts = [
  "src/promptlm/resources/prompts/**/*.json",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/promptlm",
  "tests",
  "README.md",
  "pyproject.toml",
]
artifacts = [
  "src/promptlm/resources/prompts/**/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/promptlm"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
