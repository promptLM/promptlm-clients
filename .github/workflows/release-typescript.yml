name: Release TypeScript SDK

# Thin caller for the org-wide reusable TypeScript publish workflow.
# The reusable owns: validate -> verify (eslint/tsc/vitest) -> build (tsup)
# -> npm publish with Trusted Publishing (OIDC) + provenance.
#
# Filename note: the npm Trusted Publisher must be configured to match this
# exact filename (release-typescript.yml). Tracked in issue #50.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.1.0)
        required: true
        type: string
      dry-run:
        description: Build only; skip npm publish
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      dry-run:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    uses: promptLM/.github/.github/workflows/release-ts-npm.yml@main
    with:
      package-name: '@promptlm/client'
      package-dir: client-sdk-ts
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
    # NO `secrets: inherit` — npm publish uses OIDC Trusted Publishing + provenance.

  consumer-smoke:
    # Post-publish verification: install the just-published tarball from npm
    # (NOT from the workspace) and exercise the loader against the bundled
    # `translate` fixture. Catches missing files in `package.json#files` and
    # npm CDN propagation issues that pre-publish smoke can't.
    needs: release
    if: ${{ inputs.dry-run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install @promptlm/client@${{ inputs.version }} from npm (poll-retry)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          # npm CDN can lag a couple of minutes after publish. Retry up to
          # ~5 min (10 attempts * 30s).
          for attempt in $(seq 1 10); do
            echo "Attempt ${attempt}: installing @promptlm/client@${VERSION}"
            if npm install --no-audit --no-fund "@promptlm/client@${VERSION}"; then
              echo "Installed @promptlm/client@${VERSION}"
              exit 0
            fi
            echo "Install failed; sleeping 30s before retry."
            sleep 30
          done
          echo "@promptlm/client@${VERSION} not installable from npm after retries." >&2
          exit 1

      - name: Run inline consumer (load translate, assert payload)
        run: |
          cat > /tmp/smoke/check.mjs <<'EOF'
          import { JsonPromptLoader, PackageResourcePromptSource } from '@promptlm/client';
          const prompt = await new JsonPromptLoader(new PackageResourcePromptSource()).loadPrompt('translate');
          if (prompt.prompt !== 'Translate the following text.\n') {
            throw new Error(`Unexpected prompt payload: ${JSON.stringify(prompt.prompt)}`);
          }
          if (prompt.name !== 'Text Translator') {
            throw new Error(`Unexpected prompt name: ${prompt.name}`);
          }
          console.log('consumer-smoke OK:', prompt.id, prompt.version);
          EOF
          node /tmp/smoke/check.mjs
