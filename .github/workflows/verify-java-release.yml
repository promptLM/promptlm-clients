name: Verify Java Release Build

# The `verify-release-build` job is a required status check in the `main`
# branch ruleset. GitHub treats a required check that never reports as
# "expected" indefinitely, which would block every PR that doesn't touch
# Java paths (action bumps, Python-only changes, etc).
#
# So the workflow always runs on pull_request; the job inspects the diff
# and either runs the real Maven verify or short-circuits to a no-op,
# either way reporting `verify-release-build = success`. On push to main
# we keep the paths filter — no required-check semantics there.

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-java-release.yml"
      - ".github/workflows/release-java.yml"
      - "build-jdk.sh"
      - "pom.xml"
      - "client-sdk-java/**"
      - "docs/releasing-java.md"
      - "LICENSE"

jobs:
  verify-release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect whether Java release paths changed
        id: changed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          paths_regex='^(\.github/workflows/(verify-java-release|release-java)\.yml|build-jdk\.sh|pom\.xml|client-sdk-java/|docs/releasing-java\.md|LICENSE$)'
          if gh pr view "${{ github.event.pull_request.number }}" \
                --repo "${{ github.repository }}" \
                --json files --jq '.files[].path' \
              | grep -qE "$paths_regex"; then
            echo "java=true" >> "$GITHUB_OUTPUT"
          else
            echo "java=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: github.event_name != 'pull_request' || steps.changed.outputs.java == 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify release profile
        if: github.event_name != 'pull_request' || steps.changed.outputs.java == 'true'
        run: ./mvnw -B -Prelease-java -pl client-sdk-java -am -Dgpg.skip=true -DskipTests verify

      - name: No-op (no Java release paths changed)
        if: github.event_name == 'pull_request' && steps.changed.outputs.java != 'true'
        run: echo "No Java release paths changed in this PR; verify-release-build is a no-op."
