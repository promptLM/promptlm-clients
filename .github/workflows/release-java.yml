name: Release Java SDK

# Thin caller of the org-wide reusable release-java-central workflow.
# The reusable owns: validate-inputs -> verify -> smoke-sign -> deploy -> promote
# (build, GPG sign, deploy to Sonatype Central Portal, wait for validation,
# and promote behind the `maven-central-publish` environment gate).
#
# Triggered manually for the 0.1.0 cycle; release-please will own the trigger
# once it lands (see #24).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.1.0)
        required: true
      dry-run:
        description: Build and sign but do not deploy or promote
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      dry-run:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: promptLM/.github/.github/workflows/release-java-central.yml@main
    with:
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
      probe-path: dev/promptlm/promptlm-client
    secrets: inherit

  consumer-smoke:
    # Post-publish verification: pull `dev.promptlm:promptlm-client:${VERSION}`
    # from Maven Central (NOT from the workspace) and exercise
    # ClasspathPromptLoader against the bundled `translate` fixture.
    #
    # Maven Central sync (Sonatype Central Portal -> Maven Central index ->
    # repo1.maven.org) can take ~30 min, occasionally longer. The script
    # polls with `dependency:get` until it resolves, with a 45-minute job
    # timeout as backstop.
    #
    # The actual poll + assertions live in tools/consumer-smoke/java/ so
    # they can be run and debugged locally; see that README.
    needs: release
    if: ${{ inputs.dry-run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Smoke
        run: tools/consumer-smoke/java/smoke.sh "${{ inputs.version }}"
