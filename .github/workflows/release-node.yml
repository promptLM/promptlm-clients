name: Release Node client

on:
  push:
    tags:
      - "node-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish (e.g. 0.1.0). For tag-driven runs this is read from the tag.
        required: false
      dist_tag:
        description: npm dist-tag (latest, next, beta, ...)
        required: false
        default: latest

jobs:
  verify-node-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client-sdk-ts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: client-sdk-ts/package-lock.json

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # tag is node-vX.Y.Z -> strip the node-v prefix
            VERSION="${GITHUB_REF_NAME#node-v}"
          fi
          case "$VERSION" in
            ''|*-SNAPSHOT|*[!0-9.A-Za-z-]*)
              echo "Invalid release version: '$VERSION'" >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Check package.json version matches tag
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "package.json version ($PKG_VERSION) does not match release version (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack tarball
        run: npm pack

      - name: Upload built tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-dist
          path: client-sdk-ts/*.tgz
          if-no-files-found: error
          retention-days: 7

  release-node:
    needs: verify-node-release
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@promptlm/client
    permissions:
      contents: read
      id-token: write   # required for npm --provenance attestation
    defaults:
      run:
        working-directory: client-sdk-ts
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Once npm Trusted Publishing is configured for @promptlm/client at
      # https://www.npmjs.com/settings/promptlm/tokens, the NPM_TOKEN secret
      # can be removed and `npm publish` will auth via OIDC alone.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: client-sdk-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public --tag "${{ inputs.dist_tag || 'latest' }}"
