name: Release Python SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.1.0)
        required: true
      dry-run:
        description: Build only; do not publish
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      dry-run:
        type: boolean
        default: false

jobs:
  release:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: promptLM/.github/.github/workflows/release-python-pypi.yml@main
    with:
      package-name: promptlm-client
      package-dir: client-sdk-python
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
    # NO `secrets: inherit` — PyPI publish uses OIDC (Trusted Publishing).

  consumer-smoke:
    # Post-publish verification: install the just-published wheel from PyPI
    # (NOT from the workspace) and exercise the loader against the bundled
    # `translate` fixture. Catches missing files in the published artifact
    # and PyPI propagation/serving issues that pre-publish smoke can't.
    #
    # The actual install + assertions live in tools/consumer-smoke/python/
    # so they can be run and debugged locally; see that README.
    needs: release
    if: ${{ inputs.dry-run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Smoke
        run: tools/consumer-smoke/python/smoke.sh "${{ inputs.version }}"
