name: Release Python SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.1.0)
        required: true
      dry-run:
        description: Build only; do not publish
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      dry-run:
        type: boolean
        default: false

jobs:
  release:
    uses: promptLM/.github/.github/workflows/release-python-pypi.yml@main
    with:
      package-name: promptlm-client
      package-dir: client-sdk-python
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry-run }}
    # NO `secrets: inherit` — PyPI publish uses OIDC (Trusted Publishing).

  consumer-smoke:
    # Post-publish verification: install the just-published wheel from PyPI
    # (NOT from the workspace) and exercise the loader against the bundled
    # `translate` fixture. Catches missing files in the published artifact
    # and PyPI propagation/serving issues that pre-publish smoke can't.
    needs: release
    if: ${{ inputs.dry-run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install promptlm-client==${{ inputs.version }} from PyPI (poll-retry)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python -m venv /tmp/smoke-venv
          # PyPI propagates fast but the just-published index can lag a few
          # seconds. Retry up to ~5 min (10 attempts * 30s).
          for attempt in $(seq 1 10); do
            echo "Attempt ${attempt}: installing promptlm-client==${VERSION}"
            if /tmp/smoke-venv/bin/pip install --no-cache-dir "promptlm-client==${VERSION}"; then
              echo "Installed promptlm-client==${VERSION}"
              exit 0
            fi
            echo "Install failed; sleeping 30s before retry."
            sleep 30
          done
          echo "promptlm-client==${VERSION} not installable from PyPI after retries." >&2
          exit 1

      - name: Run inline consumer (load translate, assert payload)
        run: |
          /tmp/smoke-venv/bin/python -c "
          from promptlm_client import JsonPromptLoader, PackageResourcePromptSource
          prompt = JsonPromptLoader(PackageResourcePromptSource()).load_prompt('translate')
          assert prompt.prompt == 'Translate the following text.\n', repr(prompt.prompt)
          assert prompt.name == 'Text Translator', repr(prompt.name)
          print('consumer-smoke OK:', prompt.id, prompt.version)
          "
