name: Release Python client

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish (e.g. 0.1.0). For tag-driven runs this is read from the tag.
        required: false

jobs:
  verify-python-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client-python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # tag is python-vX.Y.Z -> strip the python-v prefix
            VERSION="${GITHUB_REF_NAME#python-v}"
          fi
          case "$VERSION" in
            ''|*-SNAPSHOT|*[!0-9.A-Za-z-]*)
              echo "Invalid release version: '$VERSION'" >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint and test
        run: |
          uv run --no-sync pytest -q

      - name: Build sdist + wheel
        run: uv build

      - name: Upload built artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: client-python/dist/*
          if-no-files-found: error
          retention-days: 7

  release-python:
    needs: verify-python-release
    runs-on: ubuntu-latest
    # PyPI Trusted Publisher requires the environment to match exactly.
    environment:
      name: pypi
      url: https://pypi.org/project/promptlm-client/
    permissions:
      contents: read
      id-token: write   # required for PyPI OIDC trusted publishing
    defaults:
      run:
        working-directory: client-python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: client-python/dist

      - name: Publish to PyPI
        run: uv publish
        # uv publish auto-detects the GitHub OIDC token when id-token: write is set
        # and the PyPI pending publisher is configured for this repo + workflow + environment.
